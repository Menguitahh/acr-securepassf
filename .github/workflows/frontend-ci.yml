name: frontend-ci

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: install
        run: npm ci

      - name: generate expo router types
        working-directory: mobile
        env:
          CI: '1'
        run: npx expo customize tsconfig.json

      - name: tsc
        run: npm run typecheck --workspaces --if-present

      - name: eslint
        run: npm run lint --workspaces --if-present

      - name: vitest
        working-directory: mobile
        run: npm run test

      - name: expo-doctor
        working-directory: mobile
        run: npx expo-doctor
