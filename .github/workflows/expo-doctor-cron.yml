name: expo-doctor-cron

# Detecta drift de patches SDK 57 (#59): Expo publica un patch, expo-doctor
# empieza a fallar en develop aunque nadie toque el repo. El cron corre la
# MISMA herramienta que el CI de PRs (expo install --check / expo-doctor),
# asi que cero divergencia posible entre lo que detecta y lo que rompe.
#
# Cuando encuentra drift, aplica `expo install --fix` y abre (o actualiza)
# UN unico PR en la rama chore/expo-doctor-drift-auto. Si no hay drift,
# no crea nada. Si el drift crece dia a dia, force-pushea al mismo PR
# — nunca acumula multiples PRs por el mismo tema.

on:
  schedule:
    # 12:00 UTC = 09:00 Mza, todos los dias. Expo publica cuando quiere:
    # un patch del sabado quedaba fuera del rango habil y se descubria
    # recien el lunes por un PR roto. Corre todos los dias por eso.
    - cron: '0 12 * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write
  # #151: gh workflow run del CI sobre el PR del bot.
  actions: write

concurrency:
  group: expo-doctor-cron
  cancel-in-progress: false

jobs:
  check-and-fix:
    name: check-and-fix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: develop

      - name: set up Node 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: install
        run: npm ci

      - name: expo install --fix
        working-directory: mobile
        run: npx expo install --fix

      - name: detectar drift
        id: drift
        working-directory: mobile
        run: git diff --quiet || echo "found=true" >> "$GITHUB_OUTPUT"

      - name: expo-doctor (verifica que el fix haya alcanzado)
        working-directory: mobile
        run: npx expo-doctor

      - name: create or update PR si hay diff
        id: cpr
        uses: peter-evans/create-pull-request@v7
        with:
          base: develop
          branch: chore/expo-doctor-drift-auto
          delete-branch: true
          title: 'chore(deps): auto-bump para pasar expo-doctor'
          # Reviewer + assignee para que el PR notifique en vez de acumularse
          # en la cola sin que nadie se entere. Ver discusion en #112.
          reviewers: Menguitahh
          assignees: Menguitahh
          commit-message: |
            chore(deps): auto-bump por drift detectado por el cron

            Ejecutado por el workflow expo-doctor-cron. El bump surge de
            `expo install --fix` con la ultima expectativa del SDK 57.

            Refs #59
          body: |
            Auto-abierto por `.github/workflows/expo-doctor-cron.yml` cuando `expo install --fix` produce cambios (Expo publico patches nuevos del SDK 57 y el `package.json` de develop quedo atras).

            Si el cron vuelve a detectar drift adicional, este PR se actualiza en el mismo branch (no se crean PRs duplicados).

            Antes de mergear:
            - [ ] Revisar el diff de `mobile/package.json` y `package-lock.json`.
            - [ ] Confirmar que el CI de este PR pasa (incluye expo-doctor).

            Refs #59

      # #151: el PR lo crea GITHUB_TOKEN y GitHub no dispara pull_request por
      # eventos de ese token, asi que frontend-ci no corria nunca sobre el PR
      # del bot. workflow_dispatch es la excepcion que ese token si puede
      # disparar; el run queda sobre el head de la rama y aparece en los
      # checks del PR. Corre cada dia con drift, aunque el PR ya existiera:
      # un rerun sobre el mismo head no molesta y cubre el caso "sin cambios".
      - name: correr frontend-ci sobre el PR del bot
        if: steps.drift.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run frontend-ci.yml --repo "$GITHUB_REPOSITORY" --ref chore/expo-doctor-drift-auto

      # #151: abrir el PR no arregla develop. Mientras no se mergee, develop
      # falla en expo-doctor; el cron termina en rojo para que el dashboard de
      # Actions lo muestre en vez de verse verde.
      - name: drift pendiente en develop
        if: steps.drift.outputs.found == 'true'
        run: |
          echo "::error::develop tiene drift de Expo SDK 57; mergear ${{ steps.cpr.outputs.pull-request-url }}"
          exit 1
